<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emoji 语义搜索</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="./style.css" />
  <script src="/analytics.js"></script>
</head>
<body>
  <header class="hero">
    <h1 class="hero__title">Emoji 语义搜索</h1>
  </header>

  <main class="main">
    <form class="search" id="search-form" autocomplete="off" role="search">
      <input
        class="search__input"
        id="query"
        name="q"
        type="search"
        placeholder="用自然语言描述你要找的 emoji，例如：我想鼓励别人 / 表达感谢 / 钱"
        aria-label="搜索 emoji"
      />
      <button class="btn btn--primary" id="submit" type="submit">搜索</button>
    </form>

    <div class="examples" id="examples" aria-label="示例查询"></div>

    <p class="meta" id="meta" aria-live="polite"></p>
    <section class="grid" id="results"></section>
  </main>

  <footer class="footer">
    <p class="footer__hint">
      提示：点击 emoji 可复制；<kbd>Enter</kbd> 搜索，<kbd>Esc</kbd> 清空
    </p>
    <p class="footer__star">
      如果这个工具帮到了你，欢迎到
      <a
        class="github-link"
        id="github-link"
        href="https://github.com/Qiuzcc/emoji-semantic-search"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg class="github-link__icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
        </svg>
        <span>GitHub</span>
      </a>
      点个 <span aria-hidden="true">⭐</span> Star 支持一下
    </p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
