<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emoji 语义搜索</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="hero">
    <h1 class="hero__title">Emoji 语义搜索</h1>
  </header>

  <main class="main">
    <form class="search" id="search-form" autocomplete="off" role="search">
      <input
        class="search__input"
        id="query"
        name="q"
        type="search"
        placeholder="用自然语言描述你要找的 emoji，例如：我想鼓励别人 / 表达感谢 / 钱"
        aria-label="搜索 emoji"
      />
      <button class="btn btn--primary" id="submit" type="submit">搜索</button>
    </form>

    <div class="examples" id="examples" aria-label="示例查询"></div>

    <p class="meta" id="meta" aria-live="polite"></p>
    <section class="grid" id="results"></section>
  </main>

  <footer class="footer">
    <p class="footer__hint">
      提示：点击 emoji 可复制；<kbd>Enter</kbd> 搜索，<kbd>Esc</kbd> 清空
    </p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
